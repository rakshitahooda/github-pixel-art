
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pixel Art Studio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 30px;
    }

    .studio {
      max-width: 900px;
      margin: auto;
    }

    h1 { color: #c4a1ff; }

    button, select {
      padding: 10px 14px;
      margin: 6px 4px 14px 0;
      border-radius: 7px;
      border: 1px solid #444c56;
      background: #21262d;
      color: white;
      cursor: pointer;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(52, minmax(5px, 1fr));
      gap: 3px;
      overflow-x: auto;
    }

    .week {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      gap: 3px;
    }

    .day {
      width: 100%;
      min-width: 5px;
      border-radius: 2px;
      background: #21262d;
      aspect-ratio: 1;
    }

    .day.filled { background: #a371f7; }

    .hint {
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="studio">
    <h1>✦ GitHub Pixel Art Studio</h1>
    <p>Design your own contribution-calendar pattern.</p>

    <label for="design">Choose a design:</label>
    <select id="design">
      <option value="heart">Purple Heart</option>
      <option value="star">Star</option>
      <option value="initials">Initials-style bars</option>
      <option value="random">Random preview</option>
    </select>

    <button id="draw">Generate design</button>
    <button id="clear">Clear grid</button>

    <p id="status" class="hint">52 weeks · 7 days · Preview only</p>
    <div id="calendar" class="calendar"></div>
    <p class="hint">
      This is a local design preview. It does not create GitHub commits.
    </p>
  </main>

  <script>
    const calendar = document.getElementById("calendar");
    const design = document.getElementById("design");
    const status = document.getElementById("status");

    const WEEKS = 52;
    const DAYS = 7;

    function drawCalendar() {
      calendar.innerHTML = "";

      const cells = [];

      for (let week = 0; week < WEEKS; week++) {
        const column = document.createElement("div");
        column.className = "week";

        for (let day = 0; day < DAYS; day++) {
          const cell = document.createElement("button");
          cell.className = "day";
          cell.type = "button";
          cell.setAttribute("aria-label",
            `Week ${week + 1}, day ${day + 1}`);

          cell.addEventListener("click", () => {
            cell.classList.toggle("filled");
          });

          column.appendChild(cell);
          cells.push({ week, day, cell });
        }

        calendar.appendChild(column);
      }

      const selected = design.value;

      for (const { week, day, cell } of cells) {
        let filled = false;

        if (selected === "heart") {
          const heart = [
            "01100110",
            "11111111",
            "11111111",
            "01111110",
            "00111100",
            "00011000",
            "00000000"
          ];

          const x = week - 22;
          filled = x >= 0 && x < 8 && heart[day][x] === "1";
        }

        if (selected === "star") {
          const star = [
            "0001000",
            "0001000",
            "1111111",
            "0111110",
            "0011100",
            "0101010",
            "1000001"
          ];

          const x = week - 22;
          filled = x >= 0 && x < 7 && star[x][day] === "1";
        }

        if (selected === "initials") {
          filled = week >= 22 && week <= 29 &&
            ((day === 0 || day === 3 || day === 6) ||
             (week === 22 || week === 29));
        }

        if (selected === "random") {
          filled = Math.random() < 0.22;
        }

        cell.classList.toggle("filled", filled);
      }

      status.textContent =
        `${WEEKS} weeks · ${DAYS} days · ${selected} preview`;
    }

    document.getElementById("draw").addEventListener("click", drawCalendar);

    document.getElementById("clear").addEventListener("click", () => {
      calendar.querySelectorAll(".day").forEach(cell => {
        cell.classList.remove("filled");
      });
      status.textContent = "Grid cleared · Click squares to draw";
    });

    drawCalendar();
  </script>
</body>
</html>
